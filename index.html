<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Which Pokémon Do You Resemble?</title>
<style>
  :root {
    --bg: #0f1226;
    --card: #1a1f3a;
    --accent: #ffcb05;
    --accent2: #3d7dca;
    --red: #ee1515;
    --text: #f5f7ff;
    --muted: #9aa3c7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #2a3170 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 32px 16px 64px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(28px, 4vw, 44px);
    text-align: center;
    letter-spacing: -0.02em;
  }
  h1 .y { color: var(--accent); }
  h1 .b { color: var(--accent2); }
  p.tag { color: var(--muted); margin: 0 0 28px; text-align:center; }
  .card {
    width: 100%; max-width: 560px;
    background: var(--card);
    border: 1px solid #2a2f55;
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,.5);
  }
  .drop {
    border: 2px dashed #3a4172;
    border-radius: 14px;
    padding: 32px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop.over { border-color: var(--accent); background: #20264a; }
  .drop p { margin: 6px 0; }
  .drop .hint { color: var(--muted); font-size: 13px; }
  input[type=file] { display: none; }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: #1a1a1a;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    margin-top: 12px;
  }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .preview-wrap {
    margin-top: 20px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .preview-wrap.show { display: flex; }
  .you {
    width: 180px; height: 180px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--accent);
  }
  .vs { font-size: 28px; color: var(--muted); }
  .result {
    width: 100%;
    background: linear-gradient(180deg, #20264a 0%, #1a1f3a 100%);
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    border: 1px solid #2f3666;
  }
  .result img { width: 200px; height: 200px; image-rendering: pixelated; }
  .result h2 { margin: 8px 0 4px; text-transform: capitalize; font-size: 28px; }
  .result .types { display:flex; justify-content:center; gap:6px; margin: 8px 0; flex-wrap:wrap; }
  .type-chip { padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; color:#fff; text-transform: capitalize; }
  .reason { color: var(--muted); font-size: 14px; margin-top: 10px; }
  .swatch { display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:middle; margin-right:6px; border:1px solid rgba(255,255,255,.2); }
  footer { color: var(--muted); margin-top: 28px; font-size: 12px; text-align:center; }
  .err { color: #ff8a8a; margin-top: 8px; font-size: 13px; }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid #2f3666;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <h1><span class="y">Which</span> <span class="b">Pokémon</span> do you resemble<span class="y">?</span></h1>
  <p class="tag">Upload a photo. We'll match its vibe (dominant colors) to a Pokémon.</p>

  <div class="card">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*" />
      <p><strong>Click to upload</strong> or drag & drop</p>
      <p class="hint">JPG / PNG / HEIC · stays on your device</p>
    </label>
    <div id="err" class="err"></div>

    <div class="preview-wrap" id="previewWrap">
      <img class="you" id="you" alt="you" />
      <div class="vs">↓</div>
      <div id="loading" class="spinner" style="display:none"></div>
      <div class="result" id="result" style="display:none">
        <img id="pokeImg" alt="" />
        <h2 id="pokeName"></h2>
        <div class="types" id="pokeTypes"></div>
        <div class="reason" id="reason"></div>
      </div>
      <button class="btn" id="again" style="display:none">Try another photo</button>
    </div>
  </div>

  <footer>Made for fun. Not affiliated with The Pokémon Company.<br/>Sprites via PokeAPI.</footer>

<script>
// Curated list: dominant-color profile -> Pokémon. RGB anchors picked by hand.
const POKEMON = [
  { name: "pikachu",    id: 25,  rgb: [255, 203, 5],   tag: "bright yellow" },
  { name: "charmander", id: 4,   rgb: [240, 128, 48],  tag: "warm orange" },
  { name: "charizard",  id: 6,   rgb: [220, 80, 30],   tag: "fiery red-orange" },
  { name: "bulbasaur",  id: 1,   rgb: [120, 200, 80],  tag: "leafy green" },
  { name: "squirtle",   id: 7,   rgb: [110, 190, 230], tag: "calm aqua" },
  { name: "blastoise",  id: 9,   rgb: [80, 130, 200],  tag: "deep blue" },
  { name: "jigglypuff", id: 39,  rgb: [255, 180, 200], tag: "soft pink" },
  { name: "gengar",     id: 94,  rgb: [80, 60, 110],   tag: "shadowy purple" },
  { name: "snorlax",    id: 143, rgb: [70, 90, 110],   tag: "slate blue-grey" },
  { name: "eevee",      id: 133, rgb: [200, 160, 110], tag: "warm tan" },
  { name: "mewtwo",     id: 150, rgb: [180, 175, 200], tag: "cool lavender-grey" },
  { name: "psyduck",    id: 54,  rgb: [245, 220, 110], tag: "pale yellow" },
  { name: "machamp",    id: 68,  rgb: [120, 140, 180], tag: "muscle blue" },
  { name: "lapras",     id: 131, rgb: [120, 160, 200], tag: "ocean blue" },
  { name: "ditto",      id: 132, rgb: [200, 130, 200], tag: "bubblegum mauve" },
  { name: "onix",       id: 95,  rgb: [120, 120, 130], tag: "stone grey" },
  { name: "gyarados",   id: 130, rgb: [50, 90, 160],   tag: "stormy navy" },
  { name: "vulpix",     id: 37,  rgb: [220, 150, 100], tag: "fox amber" },
  { name: "umbreon",    id: 197, rgb: [40, 40, 60],    tag: "midnight black" },
  { name: "espeon",     id: 196, rgb: [200, 140, 200], tag: "psychic violet" },
  { name: "absol",      id: 359, rgb: [230, 230, 240], tag: "pale moonlight" },
  { name: "lucario",    id: 448, rgb: [50, 80, 130],   tag: "steel blue" },
];

const TYPE_COLORS = {
  fire:"#EE8130", water:"#6390F0", grass:"#7AC74C", electric:"#F7D02C",
  ice:"#96D9D6", fighting:"#C22E28", poison:"#A33EA1", ground:"#E2BF65",
  flying:"#A98FF3", psychic:"#F95587", bug:"#A6B91A", rock:"#B6A136",
  ghost:"#735797", dragon:"#6F35FC", dark:"#705746", steel:"#B7B7CE",
  fairy:"#D685AD", normal:"#A8A77A"
};

const $ = (id) => document.getElementById(id);
const drop = $("drop"), fileInput = $("file"), youImg = $("you");
const previewWrap = $("previewWrap"), result = $("result"), loading = $("loading");
const errBox = $("err"), again = $("again");

["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add("over");
}));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove("over");
}));
drop.addEventListener("drop", e => {
  const f = e.dataTransfer.files?.[0];
  if (f) handleFile(f);
});
fileInput.addEventListener("change", e => {
  const f = e.target.files?.[0];
  if (f) handleFile(f);
});
again.addEventListener("click", () => {
  fileInput.value = "";
  previewWrap.classList.remove("show");
  result.style.display = "none";
  again.style.display = "none";
  errBox.textContent = "";
});

function handleFile(file) {
  errBox.textContent = "";
  if (!file.type.startsWith("image/")) {
    errBox.textContent = "Please pick an image file.";
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    youImg.src = reader.result;
    previewWrap.classList.add("show");
    loading.style.display = "block";
    result.style.display = "none";
    again.style.display = "none";
    youImg.onload = () => analyze(youImg);
  };
  reader.readAsDataURL(file);
}

function rgbToHsv(r,g,b){
  r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0;
  if (d){
    if (mx===r) h = ((g-b)/d) % 6;
    else if (mx===g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h *= 60; if (h<0) h += 360;
  }
  const s = mx === 0 ? 0 : d/mx;
  return [h, s, mx];
}

function hsvToRgb(h,s,v){
  const c = v*s, x = c * (1 - Math.abs(((h/60)%2) - 1)), m = v - c;
  let r=0,g=0,b=0;
  if (h<60){r=c;g=x;} else if (h<120){r=x;g=c;}
  else if (h<180){g=c;b=x;} else if (h<240){g=x;b=c;}
  else if (h<300){r=x;b=c;} else {r=c;b=x;}
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}

function hueDistance(a,b){
  const d = Math.abs(a-b) % 360;
  return d > 180 ? 360 - d : d;
}

// Build a saturation-weighted hue+value histogram, return dominant chromatic color.
function dominantChromaticColor(ctx, x, y, w, h){
  const data = ctx.getImageData(x|0, y|0, w|0, h|0).data;
  // 18 hue bins (20° each) × 3 value bins = 54 buckets
  const HBINS = 18, VBINS = 3;
  const buckets = new Float32Array(HBINS*VBINS);
  const sums = []; // accumulate r,g,b per bucket
  for (let i = 0; i < HBINS*VBINS; i++) sums.push([0,0,0,0]);

  let greySum = [0,0,0,0]; // fallback for grey-dominant regions

  for (let i = 0; i < data.length; i += 4){
    const R = data[i], G = data[i+1], B = data[i+2];
    const [hu, sa, va] = rgbToHsv(R, G, B);
    if (va < 0.08 || va > 0.97) continue;        // skip near-black / blown highlights
    if (sa < 0.18) {                              // grey-ish — track separately
      greySum[0]+=R; greySum[1]+=G; greySum[2]+=B; greySum[3]+=1;
      continue;
    }
    const hb = Math.min(HBINS-1, Math.floor(hu / (360/HBINS)));
    const vb = Math.min(VBINS-1, Math.floor(va * VBINS));
    const idx = vb*HBINS + hb;
    const weight = sa * sa;                       // square so vivid pixels dominate
    buckets[idx] += weight;
    sums[idx][0] += R*weight;
    sums[idx][1] += G*weight;
    sums[idx][2] += B*weight;
    sums[idx][3] += weight;
  }

  // Find top bucket
  let best = -1, bestW = 0;
  for (let i = 0; i < buckets.length; i++) if (buckets[i] > bestW){ bestW = buckets[i]; best = i; }

  if (best === -1 || bestW < 0.5) {
    // Region is mostly grey — use grey average
    if (greySum[3] === 0) return null;
    return [Math.round(greySum[0]/greySum[3]), Math.round(greySum[1]/greySum[3]), Math.round(greySum[2]/greySum[3])];
  }
  const [r,g,b,wsum] = sums[best];
  return [Math.round(r/wsum), Math.round(g/wsum), Math.round(b/wsum)];
}

function colorScore(target, anchor){
  const [h1,s1,v1] = rgbToHsv(...target);
  const [h2,s2,v2] = rgbToHsv(...anchor);
  // If target is very desaturated, hue is meaningless — score by value/saturation only
  if (s1 < 0.15 && s2 < 0.15) return Math.abs(v1-v2)*2;
  const hd = hueDistance(h1,h2) / 180;
  const sd = Math.abs(s1-s2);
  const vd = Math.abs(v1-v2);
  return hd*4 + sd*1 + vd*0.8;
}

function analyze(img) {
  const c = document.createElement("canvas");
  const W = 200, H = 200;
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0, W, H);

  // 5 regions: top, middle (face), bottom, left, right
  const regions = [
    dominantChromaticColor(ctx, W*0.15, H*0.02, W*0.7,  H*0.30),
    dominantChromaticColor(ctx, W*0.25, H*0.30, W*0.5,  H*0.35),
    dominantChromaticColor(ctx, W*0.10, H*0.60, W*0.8,  H*0.38),
    dominantChromaticColor(ctx, 0,      H*0.20, W*0.25, H*0.6),
    dominantChromaticColor(ctx, W*0.75, H*0.20, W*0.25, H*0.6),
  ].filter(Boolean);

  if (!regions.length) regions.push([128,128,128]);

  // For each Pokémon, find its best-matching region; score = best region match
  const scored = POKEMON.map(p => {
    let bestScore = Infinity, bestRgb = regions[0];
    for (const rgb of regions) {
      const s = colorScore(rgb, p.rgb);
      if (s < bestScore) { bestScore = s; bestRgb = rgb; }
    }
    return { p, score: bestScore, regionRgb: bestRgb };
  }).sort((a,b) => a.score - b.score);

  // Tiebreaker via image fingerprint so near-ties don't always pick the same one
  const fp = (regions[0][0]*7 + regions[0][1]*13 + regions[0][2]*17 + regions.length*23) % POKEMON.length;
  if (scored.length > 1 && Math.abs(scored[0].score - scored[1].score) < 0.05) {
    if (scored[1].p === POKEMON[fp]) [scored[0], scored[1]] = [scored[1], scored[0]];
  }

  const winner = scored[0];
  showResult(winner.p, winner.regionRgb, scored.slice(1,3).map(s=>s.p));
}

async function showResult(p, rgb, runnersUp = []) {
  try {
    const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${p.id}`);
    const data = await res.json();
    $("pokeImg").src = data.sprites.other?.["official-artwork"]?.front_default
                    || data.sprites.front_default;
    $("pokeName").textContent = p.name;
    const types = data.types.map(t => t.type.name);
    $("pokeTypes").innerHTML = types.map(t =>
      `<span class="type-chip" style="background:${TYPE_COLORS[t]||'#555'}">${t}</span>`
    ).join("");
    const hex = "#" + rgb.map(v => v.toString(16).padStart(2,"0")).join("");
    const runnersHtml = runnersUp.length
      ? `<div style="margin-top:14px;font-size:13px;color:var(--muted)">Also a bit of: ${runnersUp.map(r=>`<strong style="color:#fff;text-transform:capitalize">${r.name}</strong>`).join(" · ")}</div>`
      : "";
    $("reason").innerHTML =
      `Your photo's vibe <span class="swatch" style="background:${hex}"></span><code>${hex}</code> reads as <strong>${p.tag}</strong> — that's pure ${p.name} energy.${runnersHtml}`;
    loading.style.display = "none";
    result.style.display = "block";
    again.style.display = "inline-block";
  } catch (e) {
    loading.style.display = "none";
    errBox.textContent = "Couldn't reach PokeAPI. Check your connection and try again.";
  }
}
</script>
</body>
</html>
